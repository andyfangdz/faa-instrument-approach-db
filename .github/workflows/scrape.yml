name: Scrape and Release
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip AIRAC date check and scrape immediately'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    # AIRAC cycles repeat every 28 days from January 25, 2024.
    # Cron cannot express this interval, so check the calendar daily.
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  check_airac:
    name: Check AIRAC schedule
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.airac_check.outputs.should_run }}
    steps:
    - uses: actions/checkout@v7
    - name: Check if today is an AIRAC effective date
      id: airac_check
      env:
        FORCE: ${{ inputs.force || 'false' }}
      run: python3 scripts/check_airac.py --force "$FORCE"

  scrape:
    name: Scrape and publish data
    needs: check_airac
    if: needs.check_airac.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Install dependencies
      run: |
        python -m pip install --only-binary=pymupdf,pymupdfb -r requirements_dev.txt

    - name: Scrape FAA data
      id: scrape_faa
      working-directory: scrape_faa
      run: |
        python -u download.py

    - name: Extract CIFP file
      working-directory: scrape_faa/download
      run: |
        7z x CIFP*.zip

    - name: Analyze Plates
      run: |
        python approach_plate_extract.py scrape_faa/download scrape_faa/download/FAACIFP18

    - name: Check for existing release
      id: release_check
      run: |
        if gh release view "$RELEASE" > /dev/null 2>&1; then
          echo "Release $RELEASE already exists, skipping."
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Release $RELEASE already exists; no new data was published." >> "$GITHUB_STEP_SUMMARY"
        fi
      env:
        RELEASE: ${{ steps.scrape_faa.outputs.release }}
        GH_TOKEN: ${{ github.token }}

    - name: Create Release
      if: steps.release_check.outputs.exists != 'true'
      run: |
        gh release create "$RELEASE" approaches.json
        echo "Published approaches.json for cycle $RELEASE." >> "$GITHUB_STEP_SUMMARY"
      env:
        RELEASE: ${{ steps.scrape_faa.outputs.release }}
        GH_TOKEN: ${{ github.token }}
